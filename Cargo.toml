[package]
name = "specman-cli"
version = "4.0.0"
edition = "2024"
authors = ["Justin (justin@justin.directory)"]
license = "MIT"
description = "Command-line interface for SpecMan workspaces"
default-run = "specman"

[[bin]]
name = "specman"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde_yaml = "0.9"
specman = { version = "6.0.2" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
